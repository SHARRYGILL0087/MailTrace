<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left Facet - Royal to Vibrant Blue -->
    <linearGradient id="facet-left" x1="10" y1="5" x2="50" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Right Facet - Vibrant Blue to Sky Blue -->
    <linearGradient id="facet-right" x1="50" y1="5" x2="90" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Edge Glow - Bright Light Blue Stroke -->
    <linearGradient id="edge-glow" x1="10" y1="5" x2="90" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.9" />
    </linearGradient>

    <!-- Inner Well Left -->
    <linearGradient id="inner-left" x1="20" y1="18" x2="50" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Inner Well Right -->
    <linearGradient id="inner-right" x1="50" y1="18" x2="80" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Core Wings Left -->
    <linearGradient id="core-left" x1="26" y1="24" x2="50" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Core Wings Right -->
    <linearGradient id="core-right" x1="50" y1="24" x2="74" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Specular Center Glow -->
    <linearGradient id="specular" x1="50" y1="20" x2="50" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E0F2FE" />
      <stop offset="70%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- 1. Outer Border / Edge Glow -->
  <path
    d="M50 5 L86 15 L90 23 L86 52 L68 74 L50 95 L32 74 L14 52 L10 23 L14 15 Z"
    fill="none"
    stroke="url(#edge-glow)"
    stroke-width="1.5"
    stroke-linejoin="miter"
  />

  <!-- 2. Outer Shield 3D Facets -->
  <path
    d="M50 6 L15 15.5 L11.5 23 L15 51.5 L32.5 73.5 L50 94 Z"
    fill="url(#facet-left)"
  />
  <path
    d="M50 6 L85 15.5 L88.5 23 L85 51.5 L67.5 73.5 L50 94 Z"
    fill="url(#facet-right)"
  />

  <!-- 3. Inner Recessed Well -->
  <path
    d="M50 14 L22 22 L19 27 L22 48 L35 67 L50 84 Z"
    fill="url(#inner-left)"
    stroke="rgba(147, 197, 253, 0.4)"
    stroke-width="0.8"
  />
  <path
    d="M50 14 L78 22 L81 27 L78 48 L65 67 L50 84 Z"
    fill="url(#inner-right)"
    stroke="rgba(147, 197, 253, 0.5)"
    stroke-width="0.8"
  />

  <!-- 4. Cyber Accent Slits -->
  <path d="M21 34 L27 38 L25 41 L19 37 Z" fill="#3B82F6" opacity="0.9" />
  <path d="M23 44 L28 48 L26 50.5 L21 46.5 Z" fill="#60A5FA" opacity="0.85" />
  <path d="M79 34 L73 38 L75 41 L81 37 Z" fill="#60A5FA" opacity="0.95" />
  <path d="M77 44 L72 48 L74 50.5 L79 46.5 Z" fill="#93C5FD" opacity="0.9" />

  <!-- 5. Central Stealth "T" & Spearhead Wings -->
  <path d="M50 21 L75 28.5 L66.5 35 L50 30.5 Z" fill="url(#core-right)" />
  <path d="M50 21 L25 28.5 L33.5 35 L50 30.5 Z" fill="url(#core-left)" />

  <!-- Blade Shaft -->
  <path d="M50 30.5 L42 41 L45 58 L50 76 Z" fill="url(#core-left)" />
  <path d="M50 30.5 L58 41 L55 58 L50 76 Z" fill="url(#core-right)" />

  <!-- Inner Bevel -->
  <path d="M50 34 L54 41 L52 54 L50 67 L48 54 L46 41 Z" fill="#1E3A8A" opacity="0.75" />

  <!-- Central Laser Spine -->
  <line x1="50" y1="8" x2="50" y2="92" stroke="url(#specular)" stroke-width="1.3" stroke-linecap="round" opacity="0.95" />

  <!-- High-Precision Diamond Node -->
  <path d="M50 37 L54 41 L50 45 L46 41 Z" fill="url(#specular)" />
  <circle cx="50" cy="41" r="1.3" fill="#FFFFFF" />
  <circle cx="50" cy="6" r="1.5" fill="#FFFFFF" />
</svg>
